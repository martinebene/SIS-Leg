# Configuración funcional canónica de SIS-Leg (WP-003).
#
# Este archivo se carga en memoria al preparar el recinto y queda congelado
# durante toda la preparación/sesión (RN-CON-07 y DT-010). Los valores aquí
# presentes son de referencia/fantasía para desarrollo: no representan una
# instalación real.

# -----------------------------------------------------------------------------
# Identidad institucional (WP-084)
# -----------------------------------------------------------------------------
#
# Nombre del cuerpo legislativo que opera esta instalación. Es el texto que la
# Pantalla del Recinto muestra en su cabecera, exactamente como se escriba acá:
# no se recorta ni se corrige, porque cada institución tiene su denominación
# oficial.
#
# La clave es obligatoria y debe ser un texto no vacío. Igual que [sonidos],
# esta sección se lee también al arrancar el backend, para que la cabecera tenga
# nombre ya en SIN_PREPARAR; esa lectura es tolerante y, si falla, muestra un
# rótulo genérico en lugar de impedir el arranque.
#
# El valor de esta plantilla es ficticio a propósito: cada instalación escribe
# el suyo en su config/system.toml local, que no se versiona.

[institucion]
nombre = "Cuerpo Legislativo de Ciudad Ejemplo"

[session]
quorum = 7

[room]
rows = [3, 4, 5]

[voting]
types = ["Ratificación", "Despacho OP", "Despacho Gob", "Despacho AS", "Despacho HA", "Despacho Eco", "Mocion", "P. Sobre Tabla", "Otro"]

[timers]
device_test_seconds = 0.6
moderation_vote_reveal_seconds = 4
public_initial_countdown_seconds = 4
public_result_display_seconds = 6

[paths]
logs_dir = "logs"

# logs_copy_dir es la única clave opcional de todo el archivo (WP-085).
#
# Qué hace: al cerrar una sesión, además de dejar los tres CSV y el informe
# "...-ACTA.txt" en logs_dir, SIS-Leg replica esos cuatro archivos dentro de
# "<logs_copy_dir>/AAAA-MM-DD/". Los archivos locales nunca se mueven ni se
# borran: la copia es redundancia posterior al cierre, no parte del registro.
#
# Cómo se interpreta: es una ruta de sistema de archivos que el sistema
# operativo ya debe tener montada y con permiso de escritura. SIS-Leg no
# implementa cliente SMB ni NFS, no monta nada y no guarda credenciales. Si la
# ruta no está disponible, la copia falla, Moderación lo avisa unos segundos y
# el cierre institucional sigue siendo válido.
#
# Viene comentada a propósito: una instalación nueva no debe empezar a escribir
# en una ruta externa sin que alguien la haya decidido. Descomentala y poné el
# destino real para activarla.
#
# logs_copy_dir = "/mnt/registros-institucionales"
#
# En un equipo de desarrollo conviene apuntar a un directorio fuera del
# repositorio, por ejemplo "/workspace/SIS-Leg-logs-copy-dev", y hacerlo en la
# copia local de config/ (config/system.toml), que no se versiona.

# -----------------------------------------------------------------------------
# Sonidos de la Pantalla del Recinto (WP-065)
# -----------------------------------------------------------------------------
#
# Cada evento sonoro declara exactamente dos claves:
#
#   ruta    -> archivo servido por la Pantalla del Recinto, relativo a la raíz
#              pública de esa aplicación. Debe empezar por "assets/sonidos/" y
#              terminar en ".wav". No se admiten URLs, rutas absolutas ni
#              segmentos ".." : el navegador nunca recibe una ruta arbitraria
#              del sistema de archivos.
#   volumen -> entero de 0 a 100. 0 silencia el evento sin borrar su
#              configuración; 100 es el volumen máximo del archivo.
#
# Las quince entradas son obligatorias y sus nombres son estables: coinciden
# con los códigos de auditoría equivalentes cuando existen. Cambiar un sonido
# es editar "ruta" y apuntar a otro archivo ya versionado (hay siete
# alternativas sin asignar en el mismo directorio); no requiere tocar código.
#
# A diferencia del resto de este archivo, esta sección también se lee al
# arrancar el backend, porque la Pantalla del Recinto debe poder reproducir
# avisos técnicos y de transmisión incluso en SIN_PREPARAR. Ver config/README.md.
#
# El catálogo completo, con duración, descripción y SHA-256 de cada archivo,
# está en assets/sonidos/README.md.

[sonidos.preparacion_iniciada]
ruta = "assets/sonidos/preparacion-iniciada.wav"
volumen = 70

[sonidos.aviso_tecnico_publicado]
ruta = "assets/sonidos/aviso-tecnico-publicado.wav"
volumen = 75

[sonidos.aviso_tecnico_retirado]
ruta = "assets/sonidos/aviso-tecnico-retirado.wav"
volumen = 60

[sonidos.pedido_palabra_registrado]
ruta = "assets/sonidos/pedido-palabra-registrado.wav"
volumen = 65

[sonidos.pedido_palabra_retirado]
ruta = "assets/sonidos/pedido-palabra-retirado.wav"
volumen = 55

[sonidos.uso_palabra_otorgado]
ruta = "assets/sonidos/uso-palabra-otorgado.wav"
volumen = 75

[sonidos.transmision_iniciada]
