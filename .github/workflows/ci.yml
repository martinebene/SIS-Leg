name: CI

on:
  # Las Pull Requests conservan deliberadamente la CI completa y sin filtros de
  # ruta: el candidato exacto que recibe revisión independiente debe validarse
  # entero, aunque el cambio parezca documental (DEC-019, sección 1).
  pull_request:
  push:
    # `branches` y `paths-ignore` se combinan con AND: la CI sólo corre si el
    # push va a `main` y además algún archivo queda fuera de las rutas exentas.
    branches: [main]
    # Exención documental exclusiva del push directo a `main` (DEC-019, sección 3).
    # GitHub omite la run únicamente cuando *todos* los archivos del push
    # coinciden con estos patrones; si al menos uno no coincide, la CI completa
    # se ejecuta igual. Por eso un commit mixto de documentación más cualquier
    # archivo material sigue cubierto, y `.github/workflows/ci.yml` queda a
    # propósito fuera de la exención: modificar la CI es un cambio material.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend · calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: '0.12.1'
          python-version: '3.14'
          enable-cache: true
      # La raíz es un proyecto y no un workspace virtual. ``--all-packages``
      # instala también FastAPI y las demás dependencias de cada miembro.
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # Comprueba que el snapshot OpenAPI versionado coincide con el backend actual (sin drift)
      - run: uv run python scripts/exportar_openapi.py --check
      # Falla si reaparece el nombre legado del proyecto fuera de la allowlist histórica (WP-077)
      - run: uv run python scripts/auditar_identidad_legada.py
      # Falla si reaparece una referencia activa a la institución de origen fuera de su
      # allowlist histórica (WP-084)
      - run: uv run python scripts/auditar_identidad_institucional.py

  backend-tests:
    name: Backend · pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: '0.12.1'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run pytest

  frontend-quality:
    name: Frontend · calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Comprueba que los tipos TypeScript coinciden con el snapshot OpenAPI versionado
      - run: pnpm check:types
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  frontend-tests:
    name: Frontend · pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ejecuta las pruebas unitarias y de sincronización/componentes con Vitest
      - run: pnpm test

  frontend-e2e:
    name: Frontend · Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  integration-e2e:
    name: Integración · E2E stack real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: '0.12.1'
          python-version: '3.14'
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --frozen --all-packages
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Este gate levanta FastAPI y ambas SPA bajo un único origen. Se mantiene
      # separado del E2E frontend para que una falla identifique su frontera real.
      - run: pnpm test:e2e:integrado
      # Valida el stack interactivo con hot reload (WP-042), ejecutando
      # procesos reales, enrutamiento mismo origen, SSE, WebSocket HMR y liberación de puertos.
      - run: uv run pytest tests/test_stack_hot.py -k test_stack_hot_integrado_completo_con_procesos_reales
      - name: Conservar diagnóstico del E2E integrado
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-integrado-diagnostico
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Frontend · build estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  production-package:
    name: Empaquetado · release productiva
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # En pull_request GitHub usa por defecto un merge commit efímero.
          # El artefacto productivo debe corresponder al candidate SHA estable;
          # en push a main el fallback conserva el SHA normal del evento.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: '0.12.1'
          python-version: '3.14'
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --frozen --all-packages
      - run: pnpm install --frozen-lockfile
      # Nginx se instala solamente en el runner efímero para validar su parser
      # real. ``nginx -t`` intenta abrir el puerto 80 declarado, por eso esta
      # única validación usa sudo dentro del runner descartable. El job no
      # configura servicios ni se conecta a producción.
      - run: sudo apt-get update
      - run: sudo apt-get install --yes nginx
      - run: sudo .venv/bin/python scripts/validar_archivos_despliegue.py
      # Ejecuta dos veces el comando canónico completo y compara tar + sidecar
      # byte a byte. La segunda salida queda disponible para smoke y artifact.
      - run: uv run python scripts/verificar_reproducibilidad_produccion.py
      - name: Smoke desde el artefacto extraído
        run: |
          SHA="$(git rev-parse HEAD)"
          uv run python scripts/validar_release_produccion.py \
            "dist/produccion/sis-leg-${SHA}.tar.gz" \
            --checksum "dist/produccion/sis-leg-${SHA}.tar.gz.sha256" \
            --sha "${SHA}"
      - name: Publicar paquete y checksum
        uses: actions/upload-artifact@v7
        with:
          name: sis-leg-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/produccion/sis-leg-*.tar.gz
            dist/produccion/sis-leg-*.tar.gz.sha256
            deploy/herramienta_despliegue.py
          if-no-files-found: error
          retention-days: 30
