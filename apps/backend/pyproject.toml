[project]
name = "sis-leg-backend"
version = "0.0.0"
description = "Runtime base FastAPI del backend de SIS-Leg"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.116,<1",
    "python-multipart>=0.0.18,<1",
    "uvicorn>=0.41,<0.42",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
