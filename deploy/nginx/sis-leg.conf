server {
    listen 80;
    # `botonera` es el nombre de red del equipo servidor en la LAN institucional, no la
    # identidad legada del proyecto: los puestos tienen ese nombre en sus marcadores y en el
    # modo kiosco. WP-077 renombró el producto sin tocarlo, porque cambiarlo obligaría a
    # reconfigurar DNS y a rehacer los accesos directos de cada puesto.
    server_name botonera;

    location = / {
        return 302 /moderacion/;
    }

    location /moderacion/ {
        root /opt/sis-leg/current/web;
        try_files $uri $uri/ /moderacion/index.html;
    }

    location /recinto/ {
        root /opt/sis-leg/current/web;
        try_files $uri $uri/ /recinto/index.html;
    }

    # El puesto de Apoyo Técnico se opera desde otro equipo de la LAN y, por decisión
    # humana del WP-056, no lleva autenticación adicional ni restricción a loopback. Es la
    # diferencia deliberada con /simulador/, que sí queda limitado al propio servidor.
    location /tecnico/ {
        root /opt/sis-leg/current/web;
        try_files $uri $uri/ /tecnico/index.html;
    }

    # Manual de usuario de SIS-Leg (WP-067). Es un HTML estático que viaja dentro de la
    # release, igual que las SPA, y se publica en una única ruta de mismo origen para que
    # el icono de ayuda de Moderación y el de Apoyo Técnico abran exactamente el mismo
    # documento. No lleva restricción de red: cualquier puesto que opere el sistema debe
    # poder consultarlo.
    location /manual/ {
        root /opt/sis-leg/current/web;
        try_files $uri $uri/ =404;
    }

    location /simulador/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        root /opt/sis-leg/current/web;
        try_files $uri $uri/ /simulador/index.html;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no always;
    }
}
