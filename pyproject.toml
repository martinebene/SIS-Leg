[project]
name = "sis-leg"
version = "0.0.0"
description = "Workspace Python de SIS-Leg"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "anyio>=4.11,<5",
    "httpx>=0.28,<0.29",
    "pyright>=1.1.404,<2",
    "pytest>=8.4,<9",
    "ruff>=0.14,<0.15",
]

[tool.uv.workspace]
members = ["apps/backend", "services/device-bridge"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["apps/backend/src", "services/device-bridge/src", "tools/device-simulator", "."]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
extraPaths = [
    "apps/backend/src",
    "services/device-bridge/src",
    "tools/device-simulator",
    ".",
]
include = [
    "apps/backend/src",
    "deploy",
    "services/device-bridge/src",
    "scripts",
    "tests",
    "tools",
]
exclude = ["**/__pycache__", ".venv"]
